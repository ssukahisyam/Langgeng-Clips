name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to create or update, for example v0.1.0-test1
        required: true
  push:
    tags:
      - 'v*-apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          LANGGENG_KEYSTORE_BASE64: ${{ secrets.LANGGENG_KEYSTORE_BASE64 }}
        run: |
          test -n "$LANGGENG_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$LANGGENG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/upload-keystore.jks"

      - name: Build release APK
        env:
          LANGGENG_STOREFILE: ${{ runner.temp }}/keystore/upload-keystore.jks
          LANGGENG_STOREPASSWORD: ${{ secrets.LANGGENG_STOREPASSWORD }}
          LANGGENG_KEYALIAS: ${{ secrets.LANGGENG_KEYALIAS }}
          LANGGENG_KEYPASSWORD: ${{ secrets.LANGGENG_KEYPASSWORD }}
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
