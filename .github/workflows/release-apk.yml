name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to create or update, for example v0.1.0-test1
        required: true
  push:
    tags:
      - 'v*-apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANGGENG_KEYSTORE_BASE64: ${{ secrets.LANGGENG_KEYSTORE_BASE64 }}
      LANGGENG_STOREPASSWORD: ${{ secrets.LANGGENG_STOREPASSWORD }}
      LANGGENG_KEYALIAS: ${{ secrets.LANGGENG_KEYALIAS }}
      LANGGENG_KEYPASSWORD: ${{ secrets.LANGGENG_KEYPASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Detect signing secrets
        run: |
          if [ -n "$LANGGENG_KEYSTORE_BASE64" ] && [ -n "$LANGGENG_STOREPASSWORD" ] && [ -n "$LANGGENG_KEYALIAS" ] && [ -n "$LANGGENG_KEYPASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Signing secrets are incomplete. Building a debug APK for tester install."
          fi

      - name: Decode upload keystore
        if: env.SIGNING_READY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$LANGGENG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/upload-keystore.jks"

      - name: Build signed release APK
        if: env.SIGNING_READY == 'true'
        env:
          LANGGENG_STOREFILE: ${{ runner.temp }}/keystore/upload-keystore.jks
        run: flutter build apk --release

      - name: Build debug APK
        if: env.SIGNING_READY != 'true'
        run: flutter build apk --debug

      - name: Prepare APK for release
        run: |
          mkdir -p dist
          if [ "$SIGNING_READY" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/langgeng-clip-release.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/langgeng-clip-debug.apk
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
