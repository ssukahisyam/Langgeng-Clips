name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to create or update, for example v0.1.0-test1
        required: true
  push:
    tags:
      - 'v*-apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANGGENG_KEYSTORE_BASE64: ${{ secrets.LANGGENG_KEYSTORE_BASE64 }}
      LANGGENG_STOREPASSWORD: ${{ secrets.LANGGENG_STOREPASSWORD }}
      LANGGENG_KEYALIAS: ${{ secrets.LANGGENG_KEYALIAS }}
      LANGGENG_KEYPASSWORD: ${{ secrets.LANGGENG_KEYPASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Detect signing secrets
        run: |
          if [ -n "$LANGGENG_KEYSTORE_BASE64" ] && [ -n "$LANGGENG_STOREPASSWORD" ] && [ -n "$LANGGENG_KEYALIAS" ] && [ -n "$LANGGENG_KEYPASSWORD" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Signing secrets are incomplete. Building a release APK with a temporary test keystore."
          fi

      - name: Prepare signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ "$SIGNING_READY" = "true" ]; then
            echo "$LANGGENG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/upload-keystore.jks"
            echo "LANGGENG_STOREFILE=$RUNNER_TEMP/keystore/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/keystore/test-release.jks" \
              -storepass android \
              -keypass android \
              -alias test \
              -keyalg RSA \
              -keysize 2048 \
              -validity 30 \
              -dname "CN=Langgeng Clip Test,O=Langgeng Clip,C=ID"
            echo "LANGGENG_STOREFILE=$RUNNER_TEMP/keystore/test-release.jks" >> "$GITHUB_ENV"
            echo "LANGGENG_STOREPASSWORD=android" >> "$GITHUB_ENV"
            echo "LANGGENG_KEYALIAS=test" >> "$GITHUB_ENV"
            echo "LANGGENG_KEYPASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK for release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/langgeng-clip-release.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
